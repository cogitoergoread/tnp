[project]
name = "tnp"
description = "Two not Touch sheets printing"
authors = [
    {name = "Joozsef Varga", email = "31209755+cogitoergoread@users.noreply.github.com"},
]
dependencies = ["numpy", "numpy-typing"]
requires-python = ">=3.14"
readme = "README.md"
license = {text = "MIT"}
dynamic = ["version"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pre-commit",
    "mypy"
]

[tool.mypy]
strict = true

[tool.ruff]
lint.select = [
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "E", # pycodestyle - Error
    "F", # Pyflakes
    "I", # isort
    "W", # pycodestyle - Warning
    "UP", # pyupgrade
]
lint.ignore = [
    "E501", # line-too-long
    "W191", # tab-indentation
]
include = ["**/*.py", "**/*.pyi", "**/pyproject.toml"]
[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.uv-dynamic-versioning]
style = "pep440" 
pattern = "default-unprefixed"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/tnp"]

[tool.pytest.ini_options]
log_level = "DEBUG"
addopts = '''
--cov=tnp
 --color=yes
 --cov-report=term
 --log-cli-level=DEBUG
'''
pythonpath = [
  "src/tnp"
]

[project.scripts]
tnp = "tnp.__main__:main"

[tool.coverage.run]
omit = [
    "*/__*__.py"
]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:"
]

